name: Release Gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release ref
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install release tooling
        run: brew install ripgrep

      - name: Verify tag, version, and changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          verification_ref="refs/release-verification/$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:$verification_ref"
          [[ "$(git cat-file -t "$verification_ref")" == tag ]]
          [[ "$(git rev-parse "$verification_ref^{}")" == "$GITHUB_SHA" ]]
          git config gpg.ssh.allowedSignersFile .github/signing-allowed-signers
          git verify-tag "$verification_ref"
          rg -q "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = lines.index("## [Unreleased]") + 1
          end = next(
              (index for index in range(start, len(lines)) if lines[index].startswith("## [")),
              len(lines),
          )
          if any(line.strip() for line in lines[start:end]):
              raise SystemExit("Unreleased must be empty on a release tag")
          PY

      - name: Repository, schema, dependency, and API gates
        run: |
          Scripts/verify-public-repository.sh
          Scripts/verify-schema-snapshot.sh
          Scripts/verify-dependency-manifest.py
          Scripts/verify-public-api.py

      - name: Strict Swift format
        run: |
          xcrun swift-format lint --strict --recursive --configuration .swift-format \
            Package.swift Sources Tests Plugins

      - name: Default build
        run: swift build

      - name: Default tests
        run: swift test --no-parallel

      - name: Isolated native build and test
        run: Scripts/verify-native-build-and-test.sh

      - name: DocC warning gate
        run: Scripts/verify-documentation.sh
