name: Swift Package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/real-codex-binary.yml

  result:
    needs: [windows, windows-runtime, validate, integration]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all package checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = []
          for name, job in jobs.items():
              if job['result'] != 'success':
                  failed.append(name)
          if failed:
              raise SystemExit('Validation did not succeed: ' + ', '.join(failed))
          PY

  windows:
    name: Windows products
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Swift
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE

      - name: Build library targets independently
        shell: pwsh
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .build/windows-products | Out-Null
          $supportedTargets = @(
            'CodexAppServerRuntime', 'CodexAppServerProtocol', 'CodexAppServerClient',
            'CodexExec', 'Codex', 'CodexAppServerStdio', 'CodexMCP',
            'CodexAppServerURLSession'
          )
          $dependencyAuditTargets = @(
            'CodexAppServerNIO', 'CodexAppServerVapor', 'CodexAppServerHummingbird'
          )
          $results = @()
          foreach ($target in ($supportedTargets + $dependencyAuditTargets)) {
            swift build --target $target *> ".build/windows-products/$target.log"
            $code = $LASTEXITCODE
            $results += [pscustomobject]@{ target = $target; supported = $supportedTargets -contains $target; exitCode = $code }
            Get-Content ".build/windows-products/$target.log" -Tail 40
          }
          $results | ConvertTo-Json | Set-Content .build/windows-products/results.json
          Copy-Item Package.resolved .build/windows-products/Package.resolved
          if ($results.Where({ $_.supported -and $_.exitCode -ne 0 }).Count -gt 0) { exit 1 }
          # GitHub's PowerShell wrapper otherwise propagates the last native audit exit code.
          exit 0

      - name: Preserve native product build results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/windows-products/
          include-hidden-files: true
          if-no-files-found: error

  windows-runtime:
    name: Windows native process runtime
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Swift
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE

      - name: Validate public Stdio and Exec consumers
        shell: pwsh
        run: |
          $developer = Split-Path (Split-Path $env:SDKROOT.TrimEnd([char[]]'\/'))
          $testing = Join-Path $developer 'Library/Testing-6.2.3/usr/bin64'
          $xctest = Join-Path $developer 'Library/XCTest-6.2.3/usr/bin64'
          if (!(Test-Path (Join-Path $testing 'Testing.dll'))) { throw 'Missing SDK Testing runtime' }
          if (!(Test-Path (Join-Path $xctest 'XCTest.dll'))) { throw 'Missing SDK XCTest runtime' }
          $env:PATH = "$testing;$xctest;$env:PATH"
          $env:SWIFT_CODEX_HOST_ONLY = 'host-only'
          New-Item -ItemType Directory -Force .build/windows-runtime | Out-Null
          $results = @()
          foreach ($configuration in @('debug', 'release')) {
            & ./Tests/WindowsIntegration/BuildFixtures.ps1 -Configuration $configuration -LogDirectory .build/windows-runtime
            $fixtureCode = $LASTEXITCODE
            $testCode = $null
            if ($fixtureCode -eq 0) {
              swift test --package-path Tests/WindowsIntegration --no-parallel -c $configuration *> ".build/windows-runtime/$configuration-tests.log"
              $testCode = $LASTEXITCODE
              Get-Content ".build/windows-runtime/$configuration-tests.log" -Tail 60
            } else {
              Get-Content ".build/windows-runtime/$configuration-fixture.log" -Tail 60
              Get-Content ".build/windows-runtime/$configuration-environment-fixture.log" -Tail 60
            }
            $results += [pscustomobject]@{ configuration = $configuration; fixtureExitCode = $fixtureCode; testExitCode = $testCode }
            $results | ConvertTo-Json | Set-Content .build/windows-runtime/results.json
          }
          if (Test-Path Tests/WindowsIntegration/Package.resolved) {
            Copy-Item Tests/WindowsIntegration/Package.resolved .build/windows-runtime/Package.resolved
          }
          if ($results.Where({ $_.fixtureExitCode -ne 0 -or $null -eq $_.testExitCode -or $_.testExitCode -ne 0 }).Count -gt 0) { exit 1 }

      - name: Preserve native runtime results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/windows-runtime/
          include-hidden-files: true
          if-no-files-found: error

  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@43cc21f34684e47903762f6eb616c545b003c5ea
